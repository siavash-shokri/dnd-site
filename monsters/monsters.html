<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>IDK YET</title>
        <link rel="stylesheet" href="style.css">
        <script type="module" src="js/main.js"></script>
    </head>
    <body>
        <header>
        </header>


        <main>
            <div id="filters">
                <label for="monsterName">Name: </label>
                <input type="text" id="monsterName">

                <label for="monsterCR">CR: </label>
                <select id="monsterCR">
                    <option value="">--Please choose the monster CR--</option>
                    <option value="0">0</option>
                    <option value="1/8">1/8</option>
                    <option value="1/4">1/4</option>
                    <option value="1/2">1/2</option>                    
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>                    
                    <option value="11">11</option>
                    <option value="12">12</option>
                    <option value="13">13</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                    <option value="16">16</option>
                    <option value="17">17</option>
                    <option value="18">18</option>
                    <option value="19">19</option>
                    <option value="20">20</option>                    
                    <option value="21">21</option>
                    <option value="22">22</option>
                    <option value="23">23</option>
                    <option value="24">24</option>
                    <option value="25">25</option>
                    <option value="26">26</option>
                    <option value="27">27</option>
                    <option value="28">28</option>
                    <option value="29">29</option>
                    <option value="30">30</option>
                </select>

                <label for="monsterType">type: </label>
                <select id="monsterType">
                    <option value="">--Please choose the monster type--</option>
                    <option value="aberration">Aberration</option>
                    <option value="beast"> Beast</option>
                    <option value="celestial">Celestial</option>
                    <option value="construct">Construct</option>
                    <option value="dragon">Dragon</option> 
                    <option value="elemental">Elemental</option>
                    <option value="fey">Fey</option>
                    <option value="fiend">Fiend</option>
                    <option value="giant">Giant</option>
                    <option value="humanoid">Humanoid</option>
                    <option value="monstrosity">Monstrosity</option> 
                    <option value="ooze">Ooze</option>
                    <option value="plant">Plant</option>
                    <option value="undead">Undead</option>
                </select>
            </div>

            <div id="sorts">
                <label for="sortingStyle">Sort: </label>
                <select id="sortingStyle">
                    <option value="nAscending">Name: A-Z</option>
                    <option value="nDescending">Name: Z-A</option>
                    <option value="crAscending">CR: Ascending</option>
                    <option value="crDescending">CR: Descending</option>
                    <option value="tAscending">type: A-Z</option>
                    <option value="tDescending">type: Z-A</option>
                </select>
            </div>
            <div id="utilities">
                <button id="resetFilters">Reset Filters</button>
                <span id="monsterCount">Loading monsters...</span>
            </div>

            <ul id="monsters"> 
            </ul>
        </main>


        <footer>
        </footer>
    </body>
</html>
